<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swim Data Editor - v1.0.5</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .badge { font-size: 0.75rem; background: #334155; color: var(--accent); padding: 2px 8px; border-radius: 99px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    
    .file-box { display: flex; flex-direction: column; gap: 10px; }
    input[type="file"] {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px dashed var(--border);
      background: #0b1120; color: var(--text); font-size: 0.95rem;
    }
    .status {
      padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; background: #0b1120;
      border-left: 4px solid var(--accent); color: #cbd5e1; word-break: break-all;
    }
    .status.error { border-left-color: var(--danger); background: #450a0a; color: #fca5a5; }
    .status.success { border-left-color: var(--success); background: #064e3b; color: #86efac; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .stat-item { display: flex; flex-direction: column; }
    .stat-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 1.2rem; font-weight: 700; color: #fff; }

    .chart-wrapper {
      position: relative;
      display: flex;
      background: #0b1120;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 12px;
    }
    .y-axis-container {
      width: 58px;
      flex-shrink: 0;
      background: #0b1120;
      border-right: 1px solid #1e293b;
      z-index: 2;
    }
    .chart-scroll-box {
      flex-grow: 1;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bar { cursor: pointer; transition: opacity 0.15s; }
    .bar:hover { opacity: 0.85; }
    .bar.selected { stroke: #ffffff; stroke-width: 2.5; }

    .actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn { padding: 9px 14px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }

    .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.75rem; margin-top: 10px; }
    .dot { width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px; }

    .hidden { display: none !important; }

    dialog {
      margin: auto; padding: 20px; background: var(--card); color: #fff;
      border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 360px;
    }
    dialog input {
      width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid var(--border);
      background: #0b1120; color: #fff; font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🏊 Swim Data Editor</h2>
      <span class="badge">v1.0.5</span>
    </div>

    <div class="card file-box">
      <input type="file" id="fitFile" accept=".fit" />
      <div id="status" class="status">Selecciona tu archivo .FIT para analizar los largos</div>
    </div>

    <div id="statsCard" class="card stats hidden">
      <div class="stat-item"><span class="stat-lbl">Distancia</span><span class="stat-val" id="stDist">-- m</span></div>
      <div class="stat-item"><span class="stat-lbl">Tiempo Nado</span><span class="stat-val" id="stTime">--:--</span></div>
      <div class="stat-item"><span class="stat-lbl">Largos</span><span class="stat-val" id="stCount">--</span></div>
      <div class="stat-item"><span class="stat-lbl">Piscina</span><span class="stat-val" id="stPool">-- m</span></div>
    </div>

    <div id="editorCard" class="card hidden">
      <div class="actions">
        <span id="selInfo" style="font-size: 0.85rem; color: var(--muted);">Toca una barra para seleccionarla</span>
        <div style="display: flex; gap: 6px;">
          <button id="btnEdit" class="btn btn-primary" disabled>⏱️ Ajustar Tiempo</button>
          <button id="btnDownload" class="btn btn-success">💾 Descargar .FIT</button>
        </div>
      </div>

      <div class="chart-wrapper">
        <div class="y-axis-container">
          <svg id="yAxisSvg" width="58" height="280"></svg>
        </div>
        <div class="chart-scroll-box" id="scrollBox">
          <svg id="chartSvg" height="280"></svg>
        </div>
      </div>

      <div class="legend">
        <span><span class="dot" style="background:#38bdf8;"></span>Crol</span>
        <span><span class="dot" style="background:#818cf8;"></span>Espalda</span>
        <span><span class="dot" style="background:#fbbf24;"></span>Braza</span>
        <span><span class="dot" style="background:#f87171;"></span>Mariposa</span>
        <span><span class="dot" style="background:#a78bfa;"></span>Técnica</span>
        <span><span class="dot" style="background:#64748b;"></span>Descanso</span>
      </div>
    </div>
  </div>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <h3>Ajustar Largo</h3>
      <p id="dlgCurrent" style="color: var(--accent); margin: 8px 0; font-size: 0.95rem; font-weight: bold;">Tiempo: --s</p>
      <label style="font-size: 0.8rem; color: var(--muted);">Tiempo real nadando (segundos o mm:ss):</label>
      <input type="text" id="dlgInput" placeholder="Ej: 38 o 0:38" required autocomplete="off" />
      <small style="color: var(--muted); font-size: 0.75rem; display: block; margin-bottom: 12px;">
        El tiempo restante se añadirá como descanso (Rest).
      </small>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('editDialog').close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Aplicar</button>
      </div>
    </form>
  </dialog>

  <script>
    let fitBytes = null;
    let originalName = 'natacion.fit';
    let lengths = [];
    let poolLength = 25;
    let selectedIdx = null;

    const statusEl = document.getElementById('status');
    const setStatus = (msg, type = 'info') => {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    };

    function readVal(dv, offset, size, isLE) {
      if (offset + size > dv.byteLength) return null;
      if (size === 1) return dv.getUint8(offset);
      if (size === 2) return dv.getUint16(offset, isLE);
      if (size === 4) return dv.getUint32(offset, isLE);
      return null;
    }

    // Formateador de tiempo legible: 45s o 1:25
    function formatTime(totalSec) {
      const s = Math.round(totalSec);
      const min = Math.floor(s / 60);
      const rem = s % 60;
      if (min === 0) return `${rem}s`;
      return `${min}:${rem.toString().padStart(2, '0')}`;
    }

    // --- PARSER FIT BINARIO DE NATACIÓN ---
    function parseSwimFit(buffer) {
      const dv = new DataView(buffer);
      if (buffer.byteLength < 14) throw new Error("Archivo demasiado corto.");
      
      const tag = String.fromCharCode(dv.getUint8(8), dv.getUint8(9), dv.getUint8(10), dv.getUint8(11));
      if (tag !== '.FIT') throw new Error("No es un archivo .FIT válido");

      const headerSize = dv.getUint8(0);
      const dataSize = dv.getUint32(4, true);
      let offset = headerSize;
      const endOffset = headerSize + dataSize;

      const localDefs = {};
      const rawLengths = [];
      let detectedPool = 25;

      while (offset < endOffset && offset < buffer.byteLength) {
        const recordHeader = dv.getUint8(offset++);
        if ((recordHeader & 0x80) !== 0) continue; // Skip timestamps comprimidos

        const isDefinition = (recordHeader & 0x40) !== 0;
        const localMsgType = recordHeader & 0x0F;

        if (isDefinition) {
          offset++; // reserved
          const arch = dv.getUint8(offset++);
          const isLE = arch === 0;
          const globalMsgNum = dv.getUint16(offset, isLE); offset += 2;
          const numFields = dv.getUint8(offset++);
          const fields = [];

          for (let f = 0; f < numFields; f++) {
            const fNum = dv.getUint8(offset++);
            const fSize = dv.getUint8(offset++);
            const fType = dv.getUint8(offset++);
            fields.push({ num: fNum, size: fSize, type: fType });
          }

          if ((recordHeader & 0x20) !== 0) {
            const devFields = dv.getUint8(offset++);
            offset += devFields * 3;
          }

          localDefs[localMsgType] = { globalMsgNum, fields, isLE };
        } else {
          const def = localDefs[localMsgType];
          if (!def) break;

          const recordStart = offset;

          // Global Message 101 = length
          if (def.globalMsgNum === 101) {
            let fieldOffset = recordStart;
            let timerTime = null;
            let elapsedTime = null;
            let stroke = 0;
            let lengthType = 1;
            let startTime = null;

            for (const f of def.fields) {
              const raw = readVal(dv, fieldOffset, f.size, def.isLE);

              if (f.num === 2 && raw !== null && raw !== 0xFFFFFFFF && raw !== 0xFFFF) {
                // total_timer_time: Garmin lo guarda con escala 1000 (ms) o 100 (centésimas)
                timerTime = raw > 1000 ? (raw / 1000) : (raw > 150 ? raw / 100 : raw);
              } else if (f.num === 1 && raw !== null && raw !== 0xFFFFFFFF && raw !== 0xFFFF) {
                // total_elapsed_time
                elapsedTime = raw > 1000 ? (raw / 1000) : (raw > 150 ? raw / 100 : raw);
              } else if (f.num === 7 && raw !== null) {
                stroke = raw; // 0: libre, 1: espalda, 2: braza, 3: mariposa, 5: rest
              } else if (f.num === 12 && raw !== null) {
                lengthType = raw; // 1: nado, 0: idle/rest
              } else if (f.num === 3 && raw !== null) {
                startTime = raw;
              }
              fieldOffset += f.size;
            }

            // Normalización de duración real del largo
            let dur = timerTime || elapsedTime || 0;
            
            // Si la duración sigue dando disparatada (> 3600 segundos = 1 hora en un solo largo), es un timestamp
            if (dur > 3600) {
              dur = 0;
            }

            rawLengths.push({
              duration: Math.round(dur),
              stroke: stroke,
              isRest: stroke === 5 || lengthType === 0,
              startTime: startTime
            });
          } else if (def.globalMsgNum === 18) {
            // Global Message 18 = session
            let fieldOffset = recordStart;
            for (const f of def.fields) {
              if (f.num === 44 && f.size === 2) {
                const p = dv.getUint16(fieldOffset, def.isLE);
                if (p > 0 && p < 10000) detectedPool = p / 100;
              }
              fieldOffset += f.size;
            }
          }

          for (const f of def.fields) offset += f.size;
        }
      }

      // Si algún largo no tenía duración explícita pero sí startTime secuencial, calcular delta
      for (let i = 0; i < rawLengths.length; i++) {
        if (rawLengths[i].duration <= 0) {
          if (i + 1 < rawLengths.length && rawLengths[i+1].startTime && rawLengths[i].startTime) {
            const diff = rawLengths[i+1].startTime - rawLengths[i].startTime;
            if (diff > 0 && diff < 300) rawLengths[i].duration = diff;
          }
          if (rawLengths[i].duration <= 0) rawLengths[i].duration = 25; // Fallback coherente
        }
      }

      return { lengths: rawLengths, pool: detectedPool };
    }

    // --- CARGA ---
    document.getElementById('fitFile').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      originalName = file.name;
      setStatus(`Analizando ${file.name}...`, 'info');

      try {
        const buffer = await file.arrayBuffer();
        fitBytes = new Uint8Array(buffer);
        const res = parseSwimFit(buffer);

        if (!res.lengths || res.lengths.length === 0) {
          throw new Error("No se detectaron largos de natación en piscina.");
        }

        lengths = res.lengths;
        poolLength = res.pool || 25;

        setStatus(`✅ ${lengths.length} largos detectados correctamente.`, 'success');
        document.getElementById('statsCard').classList.remove('hidden');
        document.getElementById('editorCard').classList.remove('hidden');
        
        updateStats();
        drawChart();
      } catch (err) {
        setStatus(`❌ Error: ${err.message}`, 'error');
      }
    });

    function strokeColor(stroke, isRest) {
      if (isRest || stroke === 5) return '#64748b';
      if (stroke === 0) return '#38bdf8';
      if (stroke === 1) return '#818cf8';
      if (stroke === 2) return '#fbbf24';
      if (stroke === 3) return '#f87171';
      return '#a78bfa';
    }

    function strokeName(stroke, isRest) {
      if (isRest || stroke === 5) return 'Descanso';
      if (stroke === 0) return 'Crol';
      if (stroke === 1) return 'Espalda';
      if (stroke === 2) return 'Braza';
      if (stroke === 3) return 'Mariposa';
      return 'Técnica';
    }

    // --- GRÁFICO ---
    function drawChart() {
      const ySvg = document.getElementById('yAxisSvg');
      const chartSvg = document.getElementById('chartSvg');
      
      const chartH = 280;
      const topPadding = 25;
      const bottomPadding = 35;
      const plotHeight = chartH - topPadding - bottomPadding;

      // Calcular máximo real (acotado a valores lógicos)
      const maxVal = Math.max(...lengths.map(l => l.duration), 45);
      const step = maxVal > 120 ? 30 : 15;
      const yMax = Math.ceil(maxVal / step) * step;

      // 1. EJE Y (Tiempo real en segundos o mm:ss)
      let yHtml = '';
      const numTicks = 4;
      for (let i = 0; i <= numTicks; i++) {
        const val = Math.round((yMax / numTicks) * i);
        const y = chartH - bottomPadding - (val / yMax) * plotHeight;
        const label = formatTime(val);
        
        yHtml += `
          <text x="50" y="${y + 4}" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="end">${label}</text>
          <line x1="52" y1="${y}" x2="58" y2="${y}" stroke="#475569" stroke-width="1"/>
        `;
      }
      ySvg.innerHTML = yHtml;

      // 2. BARRAS Y EJE X
      const barW = 18;
      const gap = 8;
      const totalW = Math.max(chartSvg.parentElement.clientWidth, lengths.length * (barW + gap) + 40);

      let chartHtml = '';

      // Líneas de cuadrícula horizontales
      for (let i = 0; i <= numTicks; i++) {
        const val = Math.round((yMax / numTicks) * i);
        const y = chartH - bottomPadding - (val / yMax) * plotHeight;
        chartHtml += `<line x1="0" y1="${y}" x2="${totalW}" y2="${y}" stroke="#1e293b" stroke-width="1"/>`;
      }

      // Eje X base
      const baseY = chartH - bottomPadding;
      chartHtml += `<line x1="0" y1="${baseY}" x2="${totalW}" y2="${baseY}" stroke="#475569" stroke-width="1.5"/>`;

      lengths.forEach((l, i) => {
        const barH = Math.max(3, (l.duration / yMax) * plotHeight);
        const x = 16 + i * (barW + gap);
        const y = baseY - barH;
        const color = strokeColor(l.stroke, l.isRest);
        const isSel = selectedIdx === i;

        // Barra limpia (sin rótulo apelotonado arriba)
        chartHtml += `
          <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3"
                fill="${color}" class="bar ${isSel ? 'selected' : ''}" data-idx="${i}">
            <title>#${i+1}: ${formatTime(l.duration)} (${strokeName(l.stroke, l.isRest)})</title>
          </rect>
        `;

        // Número de largo (#1, #2, etc.)
        chartHtml += `
          <text x="${x + barW/2}" y="${baseY + 16}" fill="${isSel ? '#ffffff' : '#94a3b8'}" 
                font-size="10" font-weight="${isSel ? 'bold' : 'normal'}" text-anchor="middle">
            #${i + 1}
          </text>
        `;
      });

      chartSvg.setAttribute('width', totalW);
      chartSvg.innerHTML = chartHtml;

      chartSvg.querySelectorAll('.bar').forEach(r => {
        r.addEventListener('click', (ev) => {
          const idx = Number(ev.target.getAttribute('data-idx'));
          selectBar(idx);
        });
      });
    }

    function selectBar(idx) {
      selectedIdx = idx;
      const l = lengths[idx];
      const name = strokeName(l.stroke, l.isRest);
      const timeStr = formatTime(l.duration);

      document.getElementById('selInfo').textContent = `Largo #${idx + 1}: ${name} — ${timeStr} (${l.duration}s)`;
      
      const btnEdit = document.getElementById('btnEdit');
      if (l.isRest) {
        btnEdit.disabled = true;
        btnEdit.textContent = 'Es Descanso';
      } else {
        btnEdit.disabled = false;
        btnEdit.textContent = '⏱️ Ajustar Tiempo';
      }
      drawChart();
    }

    function updateStats() {
      const swimLengths = lengths.filter(l => !l.isRest);
      const totalSec = swimLengths.reduce((acc, l) => acc + l.duration, 0);
      
      document.getElementById('stDist').textContent = `${swimLengths.length * poolLength} m`;
      document.getElementById('stTime').textContent = formatTime(totalSec);
      document.getElementById('stCount').textContent = lengths.length;
      document.getElementById('stPool').textContent = `${poolLength} m`;
    }

    // --- MODAL DE CORRECCIÓN ---
    const dlg = document.getElementById('editDialog');
    document.getElementById('btnEdit').addEventListener('click', () => {
      if (selectedIdx === null) return;
      const cur = lengths[selectedIdx].duration;
      document.getElementById('dlgCurrent').textContent = `Largo #${selectedIdx + 1}: ${formatTime(cur)} (${cur}s) registrados`;
      document.getElementById('dlgInput').value = '';
      dlg.showModal();
    });

    document.getElementById('editForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('dlgInput').value.trim();
      let newSec = val.includes(':') 
        ? (Number(val.split(':')[0]) * 60 + Number(val.split(':')[1]))
        : Number(val);

      if (isNaN(newSec) || newSec <= 0) return alert("Introduce un tiempo válido.");
      const cur = lengths[selectedIdx].duration;
      if (newSec >= cur) return alert(`El nuevo tiempo (${newSec}s) debe ser menor al registrado (${cur}s).`);

      const diffSec = cur - newSec;
      lengths[selectedIdx].duration = newSec;

      // Insertar descanso con los segundos restantes
      lengths.splice(selectedIdx + 1, 0, {
        duration: diffSec,
        stroke: 5,
        isRest: true
      });

      dlg.close();
      const fixedIdx = selectedIdx;
      selectedIdx = null;
      document.getElementById('btnEdit').disabled = true;
      document.getElementById('selInfo').textContent = `Largo #${fixedIdx + 1} ajustado a ${formatTime(newSec)}. Se crearon ${formatTime(diffSec)} de descanso.`;
      
      updateStats();
      drawChart();
      setStatus("Largo ajustado correctamente.", 'success');
    });

    // --- DESCARGA ---
    document.getElementById('btnDownload').addEventListener('click', () => {
      if (!fitBytes) return;
      const blob = new Blob([fitBytes], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = originalName.replace(/\.fit$/i, '_corregido.fit');
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
